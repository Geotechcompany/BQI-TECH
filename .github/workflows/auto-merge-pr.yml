name: Auto Merge Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check if auto-merge is disabled
        id: check-disabled
        run: |
          if [ -f ".github/auto-merge-disabled" ]; then
            echo "disabled=true" >> $GITHUB_OUTPUT
            echo "Auto-merge is currently disabled"
            cat .github/auto-merge-disabled
          else
            echo "disabled=false" >> $GITHUB_OUTPUT
            echo "Auto-merge is enabled"
          fi

      - name: Skip if disabled
        if: steps.check-disabled.outputs.disabled == 'true'
        run: |
          echo "Skipping auto-merge - currently disabled"
          exit 0
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Check if PR is ready for merge
        id: check-pr
        run: |
          # Check if PR is not draft and is mergeable
          if [ "${{ github.event.pull_request.draft }}" = "false" ] && [ "${{ github.event.pull_request.mergeable_state }}" = "clean" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto-merge PR
        if: steps.check-pr.outputs.ready == 'true'
        run: |
          # Get PR number
          PR_NUMBER=${{ github.event.pull_request.number }}

          # Merge the PR
          gh pr merge $PR_NUMBER --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: steps.check-pr.outputs.ready == 'true'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🤖 **Auto-merged by GitHub Actions** - This PR has been automatically merged and the branch has been deleted."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment if not ready
        if: steps.check-pr.outputs.ready == 'false'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "⏳ **Auto-merge pending** - This PR is not ready for auto-merge yet. Please ensure all checks pass and the PR is not a draft."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
